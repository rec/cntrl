# Three independently styled lines, using the existing page renderer.
brightness = 192
splash = false
screensaver_timeout = '0 s'
autoscale_fonts = true
pad = '4 px'

[instruments.pman]
instrument = 'pman'
setup = 'default'
channel = 1
output = 'din'

[[definitions.setups]]
instrument = 'pman'
name = 'default'

[[patches.fonts]]
instrument = 'pman'
program = 1
display_name = 'Font demo'

[pages.patch]
fields = ['circuit_sample', 'still_sample', 'metal_sample']

[parameters.circuit_sample]
value = 'Circuit'
style = {font_name = 'CircuitBold', foreground_color = '0x00FFFF', background_color = '0x000000'}

[parameters.still_sample]
value = 'Still Time'
style = {font_name = 'StillTime', foreground_color = '0xFFFF00', background_color = '0x000000'}

[parameters.metal_sample]
value = 'Metal Lord'
style = {font_name = 'MetalLord', foreground_color = '0xFF4040', background_color = '0x000000'}
