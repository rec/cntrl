# Three independently styled lines, using the existing page renderer.
brightness = 192
splash = false
screensaver_timeout = '0 s'
pad = '4 px'

[instruments.pman]
instrument = 'pman'
setup = 'default'
channel = 1
output = 'din'

[[definitions.setups]]
instrument = 'pman'
name = 'default'

[[patches.fonts]]
instrument = 'pman'
program = 1
display_name = 'Font demo'

[pages.patch]
fields = ['handwriting_sample', 'courier_sample', 'courier_bold_sample']

[parameters.handwriting_sample]
value = 'Caveat Bold'
style = {font_name = 'CaveatBold', foreground_color = '0x00FFFF', background_color = '0x000000'}

[parameters.courier_sample]
value = 'Courier'
style = {font_name = 'CourierPrime', foreground_color = '0xFFFF00', background_color = '0x000000'}

[parameters.courier_bold_sample]
value = 'Courier'
style = {font_name = 'CourierPrimeBold', foreground_color = '0xFF4040', background_color = '0x000000'}
