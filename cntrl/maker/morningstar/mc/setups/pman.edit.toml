chord_ms = 100
brightness = 192
splash = true
usb_midi_interface = false
screensaver_timeout = 3
pad = 4
contrast = 0.6

[style]
font_name = 'classic'

[windows.undo]
page = 'patch'

[windows.undo.style]
background_color = '0xF8FCF8'
foreground_color = '0x000000'

[windows.sent]
page = 'patch'

[windows.sent.style]
background_color = '0xF8FCF8'
foreground_color = '0x000000'

[windows.next]
page = 'patch'

[windows.next.style]
background_color = '0xF8FCF8'
foreground_color = '0x000000'

[pages.patch]
fields = ['patch_list.name', 'display_name']

[instruments.pman]
instrument = 'pman'
channel = 1
output = 'din'
# banks = []  # Not needed, because
programs = [
  [  # bank 0
    'Trumpet',  # program 1

    # Add a tag 'trumpet'. `tags` can be a list, or a string
    # that is split on commas or colons.
    {name = 'Maynard', tags = 'trumpet'},

    'Alpert',
    {},  # Means 'no information' for this program number
    'Lead Tpt',
    'ClassTpt',
    # ...
    'DrkCello',
    'Bow Bass',
    'HiStrEns',
    'Pizzicat',
  ],
  [  # bank 1
    'Harmonca',
    'MouthHrp',
    'BluesHrm',
    # ...
  ]
]

[patch_lists]
trumpet = [
  'Trumpet',
  {name = 'Maynard', instrument = 'pman'},
  'Alpert',
  'Chet Tpt',
  'Lead Tpt',
]


# NO 'none' tag or patch_list!!
