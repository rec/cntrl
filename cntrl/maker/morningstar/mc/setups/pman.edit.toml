chord_ms = 100
brightness = 192
splash = true
usb_midi_interface = false
screensaver_timeout = 3
pad = 4
contrast = 0.6

[style]
font_name = "classic"

[windows.undo]
page = "patch"

[windows.undo.style]
background_color = "0xF8FCF8"
foreground_color = "0x000000"

[windows.sent]
page = "patch"

[windows.sent.style]
background_color = "0xF8FCF8"
foreground_color = "0x000000"

[windows.next]
page = "patch"

[windows.next.style]
background_color = "0xF8FCF8"
foreground_color = "0x000000"

[pages.patch]
fields = ["patch_list.name", "display_name"]

