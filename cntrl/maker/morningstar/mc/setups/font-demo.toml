brightness = 192
splash = false
is_midi_interface = false
screensaver_timeout = 0
pad = 4
contrast = 0.6

[windows.undo]
view = "patch"

[windows.sent]
view = "patch"

[windows.next]
view = "patch"

[patch_views.patch]
fields = ["handwriting_sample", "courier_sample", "courier_bold_sample"]

[patch_views.patch.line_styles]

[tag_styles]

[parameters.handwriting_sample]
value = "Caveat Bold"

[parameters.handwriting_sample.style]
background_color = "0x000000"
foreground_color = "0x00FFFF"
font_name = "CaveatBold"

[parameters.courier_sample]
value = "Courier"

[parameters.courier_sample.style]
background_color = "0x000000"
foreground_color = "0xFFFF00"
font_name = "CourierPrime"

[parameters.courier_bold_sample]
value = "Courier"

[parameters.courier_bold_sample.style]
background_color = "0x000000"
foreground_color = "0xFF4040"
font_name = "CourierPrimeBold"

[instruments.pman]
instrument = "pman"
profile = "default"
channel = 1
output = "din"

[[definitions.profiles]]
instrument = "pman"
name = "default"

[definitions.profiles.banks]

[[definitions.programs]]
instrument = "pman"
profile = "default"
program = 1

[[patch_cycles.fonts]]
instrument = "pman"
program = 1
display_name = "Font demo"
type = "program-change"
