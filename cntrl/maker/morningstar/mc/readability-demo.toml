# Upper sample: Atkinson Hyperlegible Next SemiBold.
# Lower sample: Barlow Condensed SemiBold, at the same fitted size.
# Empty sequences let the samples be browsed without sending MIDI.
fill_in_styles = false
animation_color_cycle = false
splash = false
screensaver_timeout = '0 s'

[fonts]
AtkinsonNextSemiBold = '../../../fonts/atkinson-hyperlegible-next/AtkinsonHyperlegibleNext-SemiBold.ttf'
BarlowCondensedSemiBold = '../../../fonts/barlow-condensed/BarlowCondensed-SemiBold.ttf'

[style]
foreground_color = '0x202040'
background_color = '0xFFF8D8'

[patch_views.patch]
fields = ['comparison', 'display_name', 'name']

[patch_views.patch.line_styles]
display_name = {font_name = 'AtkinsonNextSemiBold'}
name = {font_name = 'BarlowCondensedSemiBold'}

[parameters.comparison]
value = 'Atkinson / Barlow'

[patch_cycles]
samples = [
    {name = 'Breathy Sax', patches = []},
    {name = 'BowedSaw', patches = []},
    {name = 'GuitHero 0123', patches = []},
    {name = 'WX Clari', patches = []},
]
