# Temporary CPU/heap load: 24 parallel USB input paths, 16 transforms per path.
# One cheap DIN-to-USB return observes a physical DIN OUT-to-IN loopback.
# An explicit system matrix disables raw forwarding. No DIN-to-DIN route exists.
# Non-note traffic fans out; this is not a byte-identical raw-thru fixture.
is_midi_interface = true
usb_device_midi = true
usb_host_midi = false
forward_device_to_host = false
fill_in_styles = false
pickup = false
pages = {status = {type = 'status'}}

[page_settings]
tempo_font = 'classic'
status_font = 'classic'
title_font = 'classic'

[midi.route01]
from = 'usb-device'
to = 'din'
via = [
    {transpose = 0}, {transpose = 0}, {transpose = 0}, {transpose = 0},
    {transpose = 0}, {transpose = 0}, {transpose = 0}, {transpose = 0},
    {transpose = 0}, {transpose = 0}, {transpose = 0}, {transpose = 0},
    {transpose = 0}, {transpose = 0}, {transpose = 0}, {transpose = 0},
]

