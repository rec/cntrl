# Hardware specifications and source links: README.md.
# Instances are counts or physical labels.
# TODO: documented Pro display pixel dimensions and palette sizes.
# TODO: confirm physical DIN contact counts across models.
# MC3 TRS MIDI outputs 3/4 use physical DIP switches to select wiring.

[mc3]
name = "Morningstar MC3"
buttons = "ABC"
displays = {
    lcd20x2 = {
        instances = 1,
        kind = "alphanumeric",
        width = 20,
        height = 2,
        colors = 1,
    },
}
ports = {
    din-out = {
        instances = 1,
        physical = { connector = "din" },
        modes = [{ direction = "output", protocol = { kind = "midi" } }],
    },
    usb-b = "usb_b",
    configurable-635 = {
        instances = 1,
        physical = { connector = "trs", contacts = 3, diameter_mm = 6.35 },
        modes = [
            { direction = "input", protocol = { kind = "expression" } },
            { direction = "input", protocol = { kind = "switch" } },
            { direction = "output", protocol = { kind = "midi" } },
        ],
    },
    trs-out = {
        instances = ["TRS MIDI out 1", "TRS MIDI out 2"],
        physical = { connector = "trs", contacts = 3, diameter_mm = 3.5 },
        modes = [
            {
                direction = "output",
                protocol = { kind = "midi", trs_wiring = "type_a" },
            },
        ],
    },
    trs-dip = {
        instances = ["TRS MIDI out 3", "TRS MIDI out 4"],
        physical = { connector = "trs", contacts = 3, diameter_mm = 3.5 },
        modes = [
            {
                direction = "output",
                protocol = { kind = "midi", trs_wiring = "type_a" },
            },
            {
                direction = "output",
                protocol = { kind = "midi", trs_wiring = "tip_active" },
            },
            {
                direction = "output",
                protocol = { kind = "midi", trs_wiring = "ring_active" },
            },
        ],
    },
}

