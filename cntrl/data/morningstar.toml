# Hardware specifications and source links: README.md.
# Instances are counts or physical labels.
# TODO: documented Pro display pixel dimensions and palette sizes.
# TODO: confirm physical DIN contact counts across models.
# MC3 TRS MIDI outputs 3/4 use physical DIP switches to select wiring.

[mc3]
name = "Morningstar MC3"
buttons = "ABC"

displays.lcd20x2.instances = 1
displays.lcd20x2.kind = "alphanumeric"
displays.lcd20x2.width = 20
displays.lcd20x2.height = 2
displays.lcd20x2.colors = 1

ports.din-out.instances = 1
ports.din-out.physical.connector = "din"
ports.din-out.modes = [
    { direction = "output", protocol = { kind = "midi" } },
]

ports.usb-b = "usb_b"

ports.configurable-635.instances = 1
ports.configurable-635.physical.connector = "trs"
ports.configurable-635.physical.contacts = 3
ports.configurable-635.physical.diameter_mm = 6.35
ports.configurable-635.modes = [
    { direction = "input", protocol = { kind = "expression" } },
    { direction = "input", protocol = { kind = "switch" } },
    { direction = "output", protocol = { kind = "midi" } },
]

ports.trs-out.instances = ["TRS MIDI out 1", "TRS MIDI out 2"]
ports.trs-out.physical.connector = "trs"
ports.trs-out.physical.contacts = 3
ports.trs-out.physical.diameter_mm = 3.5
ports.trs-out.modes = [
    { direction = "output", protocol = { kind = "midi", trs_wiring = "type_a" } },
]

ports.trs-dip.instances = ["TRS MIDI out 3", "TRS MIDI out 4"]
ports.trs-dip.physical.connector = "trs"
ports.trs-dip.physical.contacts = 3
ports.trs-dip.physical.diameter_mm = 3.5
ports.trs-dip.modes = [
    { direction = "output", protocol = { kind = "midi", trs_wiring = "type_a" } },
    { direction = "output", protocol = { kind = "midi", trs_wiring = "tip_active" } },
    { direction = "output", protocol = { kind = "midi", trs_wiring = "ring_active" } },
]

