# Hardware specifications and source links: README.md.
# TODO: documented MC4 Pro and MC8 Pro display dimensions and palette sizes.
# TODO: confirm physical DIN contact counts across models.
# MC3 TRS MIDI outputs 3/4 use physical DIP switches to select wiring.

['@omniport']
kinds = ["expression", "switch", "midi-out"]
physical = { connector = "trs", size = "6.35" }

['@trs']
kind = 'midi'
wiring = 'type_a'
physical = { connector = "trs", size = "3.5" }

['@relay']
kind = 'relay'
physical = { connector = "trs", size = "3.5" }

['@omniport-35']
kinds = ['expression', 'switch', 'midi-out']
physical = { connector = 'trs', size = '3.5' }

['@trs-dip']
kind = 'midi-out'
wiring = ['type_a', 'tip_active', 'ring_active']
physical = { connector = 'trs', size = '3.5' }

[mc6_pro]
name = "Morningstar MC6 Pro"
buttons = "ABCDEF"

# 2-dimensional displays are pixel, and assumed to be color, unless color=1
# 1-dimension displays are alphanumeric, and assumed to be monochromatic,
# unless color > 1
displays = ['200x200', '200x200', '200x200']

[mc6_pro.ports]
midi-in = 'midi-in'  # same as {kind='midi', direction='in'}
midi-out = 'midi-out'
usb = "usb_c"
usb-host = {kind = "usb_c", 'host' = true}
omniport = ['@omniport', '@omniport', '@omniport', '@omniport']
trs-in = '@trs-in'
trs-out = '@trs-out'
relay = ['@relay', '@relay']

[mc3]
name = 'Morningstar MC3'
buttons = 'ABC'
displays = [{size = '20x2', kind = 'alphanumeric'}]

[mc3.ports]
midi-out = 'midi-out'
usb = 'usb_b'
omniport = ['@omniport']
trs-midi-out-1 = '@trs-out'
trs-midi-out-2 = '@trs-out'
trs-midi-out-3 = '@trs-dip'
trs-midi-out-4 = '@trs-dip'

[mc6_mkii]
name = 'Morningstar MC6 MkII'
buttons = 'ABCDEF'
displays = [{size = '24x2', kind = 'alphanumeric'}]

[mc6_mkii.ports]
midi-in = 'midi-in'
midi-out = 'midi-out'
usb = 'usb_b'
omniport = ['@omniport', '@omniport']

[mc8]
name = 'Morningstar MC8'
buttons = 'ABCDEFGH'
displays = [{size = '40x4', kind = 'alphanumeric'}]

[mc8.ports]
midi-in = 'midi-in'
midi-out = 'midi-out'
usb = 'usb_b'
omniport = ['@omniport', '@omniport', '@omniport', '@omniport']

[mc4_pro]
name = 'Morningstar MC4 Pro'
buttons = 'ABCD'
displays = [{kind = 'graphical'}]

[mc4_pro.ports]
rear-trs-midi-in = '@trs-in'
side-trs-midi-in = '@trs-in'
midi-out = 'midi-out'
usb = 'usb_c'
usb-host = {kind = 'usb_c', host = true}
configurable-1 = '@omniport'
configurable-2 = '@omniport-35'
trs-out = '@trs-out'
relay = ['@relay']

[mc8_pro]
name = 'Morningstar MC8 Pro'
buttons = 'ABCDEFGH'
displays = [
    {kind = 'graphical'}, {kind = 'graphical'},
    {kind = 'graphical'}, {kind = 'graphical'},
]

[mc8_pro.ports]
midi-in = 'midi-in'
midi-out = 'midi-out'
usb = 'usb_c'
usb-host = {kind = 'usb_c', host = true}
omniport = ['@omniport', '@omniport', '@omniport', '@omniport']
trs-in = '@trs-in'
trs-out = '@trs-out'
relay = ['@relay', '@relay']
