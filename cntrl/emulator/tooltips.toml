# Emulator-only hover help. Blank entries stay hidden.
# Slots cover page-specific actions and windows used by the MC6 Pro or MC8 Pro.
# Shared navigation and setup-defined bindings have no per-page slots here.
# Windows are numbered left to right within the page; management panes can
# occupy different positions on three- and four-display controllers.
# Buttons use controller layout IDs. F can be page navigation on the MC6 Pro
# even where it has a page-specific action on the MC8 Pro.
# Add [page.locale] with the same keys to translate; blank falls back to English.

