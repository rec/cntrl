fill_in_styles = false

[instruments.a]
instrument = 'synth'
profile = 'stock'
channel = 1
output = 'din'

[[patch_cycles.wind]]
type = 'program-change'
instrument = 'a'
program = 1
name = 'Flute'
style = {foreground_color = 'white'}

[patch_views.patch]
fields = ['brightness', 'display_name', 'volume', 'tempo', 'splash_movie']

[parameters.tempo]
value = 120

[patch_views.numeric]
fields = ['program', 'bank', 'volume', 'pan', 'instrument', 'name']

[patch_views.settings]
fields = ['is_midi_interface', 'screensaver_timeout', 'navigation.hold_delay', 'scrolling.horizontal_duration']

[windows.undo]
view = 'numeric'

[windows.sent]
view = 'settings'

[windows.next.style]
background_color = 'blue'
