fill_in_styles = false

[pages.full]
type = 'None'

[pages.status]
type = 'status'
min_windows = 1

[pages.wide]
type = 'clock-tempo'
min_windows = 2

[pages.all]
type = 'clock-transport'
min_windows = 2

[pages.tap]
type = 'tap-tempo'
min_windows = 0

[pages.lead]
type = 'patch-switcher'
min_windows = 1

[pages.rhythm]
type = 'patch-switcher'
min_windows = 1
give_up_windows = ['left', 'right', 'center']

[patches.lead]
patches = [
    {type = 'delay', duration = '100 ms'},
    {type = 'control-change', output = 'din', channel = 1, controller = 7, value = 100},
]

[patches.rhythm]
type = 'program-change'
output = 'din'
channel = 1
program = 2

[patch_cycles]
main = ['lead', 'rhythm']
