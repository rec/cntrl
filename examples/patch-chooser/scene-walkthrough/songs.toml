fill_in_styles = false

[instruments.keys]
output = 'din'
channel = 1

[bindings]
d = { name = 'Sustain on', on = 'sustain_on' }
e = { name = 'Sustain off', on = 'sustain_off' }

[patches.intro]
name = 'Intro'
program = 1
inherits = 'both'
bindings = { a = { name = 'Soft keys', on = 'soft' }, b = { name = 'Loud keys', on = 'loud' } }

[patches.verse]
name = 'Verse'
program = 2
inherits = 'both'
bindings = { a = { name = 'Soft keys', on = 'soft' }, b = { name = 'Loud keys', on = 'loud' } }

[patches.chorus]
name = 'Chorus'
program = 3
inherits = 'both'
bindings = { a = { name = 'Loud keys', on = 'loud' }, b = { name = 'Soft keys', on = 'soft' } }

[patches.bridge]
name = 'Bridge'
program = 4
inherits = 'both'
bindings = { a = { name = 'Soft keys', on = 'soft' }, b = { name = 'Loud keys', on = 'loud' } }

[patches.outro]
name = 'Outro'
program = 5
inherits = 'both'
bindings = { a = { name = 'Soft keys', on = 'soft' }, b = { name = 'Loud keys', on = 'loud' } }

[patches.soft]
name = 'Soft keys'
controller = 7
value = 80

[patches.loud]
name = 'Loud keys'
controller = 7
value = 110

[patches.sustain_on]
name = 'Sustain on'
controller = 64
value = 127

[patches.sustain_off]
name = 'Sustain off'
controller = 64
value = 0

[[songs]]
name = 'First Light'
patches = ['intro', 'verse', 'chorus']
style = { foreground_color = 'navy', background_color = '0xFFF4D6' }

[[songs]]
name = 'River Road'
patches = ['verse', 'chorus', 'verse', 'outro']
style = { foreground_color = 'navy', background_color = '0xDCEEFF' }

[[songs]]
name = 'Last Train Home'
patches = ['intro', 'verse', 'chorus', 'bridge', 'chorus']
style = { foreground_color = 'white', background_color = 'navy' }

[[setlists]]
name = 'Evening Set'
songs = ['First Light', 'River Road', 'Last Train Home']
