# Suggested tags for the programs listed in missing-tags.toml.
# Proposals only; tags.toml has not been changed.
# Evidence: catalogue names/descriptions and the manufacturer's voice-list groups.
# Yamaha: https://data.yamaha.com/files/download/other_assets/5/317955/VL70mE2.pdf
# Patchman: https://www.patchmanmusic.com/turbovl.html

[instruments.vl70m.tags]
fx = [
  'SpaceZoo', 'StoneHng', 'Cybastrg', 'Mu', 'Formula', 'Jurassic', 'Devil',
  'SpcHorse', 'Jason', 'Suedhead', 'Moby',
]
# Broad synth suggestions; SlitMinu, Flaggoot, Macro and Sylophon are tentative
# because their descriptions do not identify a conventional instrument family.
synth = [
  'StoneHng', 'BuzzSaw', 'SlitMinu', 'Flaggoot', 'FlatLead', 'Moby', 'Macro',
  'Sylophon',
]
keyboard = ['AnaWurl', 'Q.Klav']
sitar = ['Sitar!', 'India']
percussion = ['YamSteel', 'DinoPerc']
# L7 Pluck is in Yamaha's guitar group. Gonzo is a tentative guitar suggestion
# based on its position among the guitar presets and its noise-control behavior.
guitar = ['L7 Pluck', 'Gonzo']
pipe = ['Gertrude']
brass = ['Electrum']
accordion = ['Jhopali', 'Squeeze']
flute = ['Recordr!', 'Ocarina!', 'YamaBotl']
harmonica = ['CromHarp', 'WahUpHp']

[instruments.patchman.tags]
# Likely player references: Kenny G, Branford Marsalis, John Coltrane, David Sanborn,
# Paul Desmond, Everette Harp, Michael Brecker and Stan Getz. Sanford is inferred
# from its position in the sax block, not from a claimed player identity.
sax = [
  'SoprnoSx', 'KennyGee', 'HeyKenG.', 'Branford', 'TraneSop', 'BrtSopSx', 'Sanborn',
  'Desmond', 'Everette', 'MBrecker', 'RaspyTnr', 'Getz Tnr', 'JobimTnr', 'Sanford',
]
# Ambience, WetFone and Lonely are tentative flute-family suggestions based on
# their placement in Patchman's flute/pipe block; the names alone are ambiguous.
flute = [
  'Real Flt', 'SilvrFlt', 'Afri Flt', 'PennyWhs', 'TinWhist', 'Inca Flt',
  'Noze Flt', 'Quena', 'Quena x2', 'Andean', 'IndiaFlt', 'Ambience', 'WetFone',
  'Maya Flt', 'PanPicol', 'Coca!!', 'Ocarina!', 'Lonely', 'Recorder', 'YamaBotl',
]
clarinet = ['ClsClrnt']
# English horn, plus the hybrid reed voices also described in Yamaha's catalogue.
reed = ['SftEngHn', 'Crumbon', 'Klarina']
pipe = ['Digirdoo']
violin = ['Fiddle', 'RosinVla']
strings = ['HiStrEns', 'Pizzicat', 'Asia Plk', 'JapanPlk', 'Tambura']
# Stevie Wonder and Toots Thielemans are harmonica references here.
harmonica = ['Harmonca', 'MouthHrp', 'BluesHrm', 'Stevie!', 'Toots!']
accordion = ['Accordn.', 'Concrtna']
organ = ['Jazz B3']
# Tentative: Funky sits beside Clavinet in the keyboard/percussion block.
keyboard = ['Funky']
percussion = ['SteelDrm', 'VL Drums', 'Yangchin']
sitar = ['Sitar']
harp = ['ElecHarp']
# Likely references: Joe Pass; B. B. King's Lucille; Pat Metheny; Carlos Santana;
# Eddie Van Halen; Jimi Hendrix. Their placement in the guitar block also agrees.
guitar = [
  'Flamenco', 'Joe Pass', 'Lucille', '>>PAT<<', 'EFXStrat', 'ClnStrat', 'Carlos',
  'Wah Lead', 'Wah Dist', 'Eddie4th', 'Feedback', 'Hendrix',
]
# These occupy Patchman's electronic lead block. Artist references such as
# ZawiLead, Corea!! and Winwood do not by themselves imply acoustic instrument tags.
# The broad synth tag is tentative for the more opaque names, especially Debussy,
# Whistler, AirStick, RotoFone, Squeezy, Freik, Fazar, Dungeon and NevrLand.
synth = [
  'TalkBox!', '!XTREME!', 'Hercules', 'Theremin', 'Avalana', 'Voxanne', 'Beauty!',
  'SpaceOut', 'Ghost Ld', 'PtchNoiz', 'Air Lead', 'Breezer', 'ZawiLead', 'Voxofone',
  'Whistler', 'Debussy', 'Sines()', 'SmoothLd', 'Slinky', 'AirStick', 'RotoFone',
  'Vox Lead', 'Squeezy', 'Lyricon', 'Ana.Lead', 'Mobius', '70s Lead', 'Osc Lead',
  'Saw Lead', 'SAWS/|/|', 'ResoSaws', 'EML Lead', 'HPFilter', 'EWI ARP', 'EWI Lead',
  'Koz Lead', 'MattLead', 'PATCHMAN', 'Taurus', 'Phaser-{', 'Winwood', 'Pulse Ld',
  'Corea!!', 'SquareLd', 'Korg Ld', 'LuckyMan', 'Lyle', 'Analog', 'Nyle', 'Floyd Ld',
  'Freik', 'Fazar', 'Dungeon', 'NevrLand', 'Brekord1', 'Brekord2', 'Brekord3',
