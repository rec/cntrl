name: Cross-platform qualification

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Qualification profile
        type: choice
        options: [core, full]
        default: full
      target_dir:
        description: Target implementation directory for a full build
        type: string
        default: ''
      cold_cache:
        description: Qualify without restored dependency or SDK caches
        type: boolean
        default: false
      native_backtrace:
        description: Capture a native backtrace if Linux Python tests crash
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cntrl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cntrl
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: ${{ !inputs.cold_cache }}
          cache-dependency-glob: cntrl/uv.lock
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        if: runner.os == 'Windows'
      - name: Linux MIDI and offscreen GUI prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config libegl1 libopengl0
      - name: Linux native crash debugger
        if: runner.os == 'Linux' && inputs.native_backtrace
        run: sudo apt-get install -y gdb
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !inputs.cold_cache }}
        with:
          path: |
            cntrl/build/freetype
            cntrl/cntrl/**/firmware/.tools
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ hashFiles('cntrl/uv.lock', 'cntrl/cntrl/fonts/provision.py', 'cntrl/cntrl/**/toolchain.py', 'cntrl/cntrl/**/*.patch') }}
      - name: Use HTTPS for public GitHub dependencies
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/
      - name: Install locked dependencies
        env:
          # middy's native CoreMIDI backend requires macOS 11 or later.
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: uv sync --frozen --group dev --extra emulator --no-editable
      - name: Provision pinned native rasterizer
        run: uv run --no-sync python -m cntrl.fonts.provision
      - name: Record tested revision
        run: git rev-parse HEAD
      - name: Qualify selected profile
        env:
          CNTRL_CI_PROFILE: ${{ inputs.profile }}
          CNTRL_CI_TARGET_DIR: ${{ inputs.target_dir }}
          CNTRL_CI_NATIVE_BACKTRACE: ${{ runner.os == 'Linux' && inputs.native_backtrace && '1' || '0' }}
        run: uv run --no-sync python -m scripts.ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-${{ matrix.os }}-${{ github.sha }}
          path: cntrl/reports
