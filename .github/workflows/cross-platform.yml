name: Cross-platform qualification

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Qualification profile
        type: choice
        options: [core, full]
        default: full
      target_dir:
        description: Target implementation directory for a full build
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cntrl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cntrl
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rec/reccy
          ref: 5d7e42b47ed8b14fba185a6be1581a013ccd9a67
          path: reccy
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
          cache-dependency-glob: cntrl/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Record tested revision
        run: git rev-parse HEAD
      - name: Collect baseline tests
        run: uv run --no-sync python -m pytest --collect-only -q --junitxml=reports/collection.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-${{ matrix.os }}-${{ github.sha }}
          path: cntrl/reports
