[project]
name = "cntrl"
version = "0.1.0"
description = "Hardware-independent descriptions of MIDI controllers"
requires-python = ">=3.13"
dependencies = [
    "fonttools>=4.67.0",
    "freetype-py>=2.5.1",
    "pillow>=13.0.0",
    "pydantic>=2,<3",
    "pyserial>=3.5",
    "python-bidi>=0.6.12",
    "reccy",
    "tomlkit>=0.15.1",
    "tqdm>=4.70.1",
    "tyro>=1.0.16",
    "uharfbuzz>=0.56.3",
]

[project.scripts]
cntrl = "cntrl.patch_switcher.cli:main"

[project.optional-dependencies]
emulator = ["pyside6-essentials>=6.10", "middy>=0.2.0"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "pyupgrade",
    "pytest-regressions>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["test", "cntrl"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.uv.sources]
reccy = { git = "https://github.com/rec/reccy.git", rev = "a2bbdc5daadcbf18660f2f184e2a38ea1903c6a0" }
middy = { git = "https://github.com/rec/middy.git", rev = "a78ac236d1849a43fc6018c3410674ad6e47c2e9" }

[tool.uv]
# middy's declared Git source is replaced by the same root-pinned reccy source.
override-dependencies = ["reccy>=0.2.0"]
