[project]
name = "cntrl"
version = "0.1.0"
description = "Hardware-independent descriptions of MIDI controllers"
requires-python = ">=3.13"
dependencies = [
    "fonttools>=4.67.0",
    "freetype-py>=2.5.1",
    "pillow>=13.0.0",
    "pydantic>=2,<3",
    "python-bidi>=0.6.12",
    "reccy",
    "tomlkit>=0.15.1",
    "tyro>=1.0.16",
    "uharfbuzz>=0.56.3",
]

[project.scripts]
cntrl = "cntrl.patch_switcher.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "pyupgrade",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["test", "cntrl"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.uv.sources]
reccy = { path = "../reccy", editable = true }
