[project]
name = "cntrl"
version = "0.1.0"
description = "Hardware-independent descriptions of MIDI controllers"
requires-python = ">=3.13"
dependencies = ["pydantic>=2,<3"]

[dependency-groups]
dev = ["pytest", "ruff", "ty", "pyupgrade"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "single"
